---
kind: pipeline
name: testing
type: vm

platform:
  os: linux
  arch: amd64

pool:
  use: ubuntu

steps:
  - name: vet
    pull: always
    image: golang:1.26.10-bookworm@sha256:632dff7351799a5a9954a48dc06670ade72ee44e8c351cdc0e5a57af2fea21af
    commands:
      - go vet ./...
    environment:
      GO111MODULE: on

  - name: test
    pull: always
    image: golang:1.26.10-alpine@sha256:27f2d3b83cfc5803c8078f8e730af0f7c431bf067afaec8f60a36fb763187cba
    commands:
      - apk --no-cache add -U 'ca-certificates>=20261020-r0' python3 python3-dev git gcc libc-dev libffi-dev openssl-dev py3-pip
      - python3 -m venv /tmp/pypi-test-env
      - . /tmp/pypi-test-env/bin/activate
      - pip3 install --no-cache-dir --upgrade 'pip>=26.2.2' 'certifi>=2026.10.19' setuptools wheel six twine
      - go test -cover ./...
    environment:
      GO111MODULE: on
      PLUGIN_DISTRIBUTIONS: sdist
      PLUGIN_PASSWORD: demo
      PLUGIN_REPOSITORY: http://pypiserver:8080/
      PLUGIN_USERNAME: demo

services:
  - name: pypiserver
    pull: always
    image: pypiserver/pypiserver
    entrypoint:
      - pypi-server
      - -P
      - .
      - -a
      - .
      - -p
      - 8080
      - /data/packages

trigger:
  branch:
    - master

---
kind: pipeline
name: linux-amd64
type: vm

platform:
  os: linux
  arch: amd64

pool:
  use: ubuntu

steps:
  - name: build-push
    pull: always
    image: golang:1.26.10-bookworm@sha256:632dff7351799a5a9954a48dc06670ade72ee44e8c351cdc0e5a57af2fea21af
    commands:
      - 'go build -v -ldflags "-X main.build=${DRONE_BUILD_NUMBER}" -a -o release/linux/amd64/drone-pypi'
    environment:
      CGO_ENABLED: 0
      GO111MODULE: on
    when:
      event:
        - push
        - pull_request

  - name: build-tag
    pull: always
    image: golang:1.26.10-bookworm@sha256:632dff7351799a5a9954a48dc06670ade72ee44e8c351cdc0e5a57af2fea21af
    commands:
      - 'go build -v -ldflags "-X main.version=${DRONE_TAG##v} -X main.build=${DRONE_BUILD_NUMBER}" -a -o release/linux/amd64/drone-pypi'
    environment:
      CGO_ENABLED: 0
      GO111MODULE: on
    when:
      event:
        - tag

  - name: executable
    pull: always
    image: golang:1.26.10-bookworm@sha256:632dff7351799a5a9954a48dc06670ade72ee44e8c351cdc0e5a57af2fea21af
    commands:
      - ./release/linux/amd64/drone-pypi --help

  - name: dryrun
    pull: always
    image: plugins/docker:linux-amd64
    settings:
      dockerfile: docker/Dockerfile.linux.amd64
      dry_run: true
      password:
        from_secret: docker_password
      repo: plugins/pypi
      tags: linux-amd64
      username:
        from_secret: docker_username
    when:
      event:
        - pull_request

  - name: publish
    pull: always
    image: plugins/docker:linux-amd64
    settings:
      auto_tag: true
      auto_tag_suffix: linux-amd64
      dockerfile: docker/Dockerfile.linux.amd64
      password:
        from_secret: docker_password
      repo: plugins/pypi
      username:
        from_secret: docker_username
    when:
      event:
        - push
        - tag

trigger:
  branch:
    - master

depends_on:
  - testing

