---
kind: pipeline
name: notifications
type: vm

platform:
  os: linux
  arch: amd64

pool:
  use: ubuntu

steps:
  - name: manifest
    pull: always
    image: plugins/manifest
    settings:
      ignore_missing: true
      password:
        from_secret: docker_password
      spec: docker/manifest.tmpl
      username:
        from_secret: docker_username

trigger:
  branch:
    - master
  event:
    - push
    - tag

depends_on:
  - linux-amd64
  - linux-arm64
